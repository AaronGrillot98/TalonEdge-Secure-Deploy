# Security CI — fails the build on any finding so insecure code never reaches main.
#
# Architecture:
#   - Each scanner job emits SARIF and uploads it as an artifact (always, even
#     on failure, so the merge job can show the findings that broke the build).
#   - A final 'merge' job downloads every SARIF artifact and runs sarif-merge
#     to produce one unified PR comment + GITHUB_STEP_SUMMARY entry —
#     deduplicating overlapping findings and bumping severity for cross-scanner
#     consensus.
#
# Action references are pinned by commit SHA. Re-resolve with:
#   ./scripts/pin-actions.sh

name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python static + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install bandit pip-audit

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Bandit (SAST for Python) — emit SARIF
        # Always run even if a previous step failed so we capture findings
        # for the merge job to surface.
        if: always()
        run: bandit -r src -ll -ii -f sarif -o bandit.sarif || echo "bandit found issues"

      - name: Bandit fail-closed (re-run for exit code)
        # bandit -f sarif silently exits 0 even with findings; re-run to enforce.
        run: bandit -r src -ll -ii

      - name: pip-audit (vulnerable runtime deps)
        run: pip-audit --strict --requirement requirements.txt

      - name: Upload bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: sarif-bandit
          path: bandit.sarif
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # We invoke gitleaks directly so we can request SARIF output —
        # gitleaks-action's SARIF support varies by version.
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --redact --no-banner --exit-code 1

      - name: Upload gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: sarif-gitleaks
          path: gitleaks.sarif
          retention-days: 7

  iac:
    name: Terraform / IaC scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tfsec
        # tfsec emits SARIF natively for the merge job. We don't fail the
        # build on tfsec findings because Trivy (next job) catches the same
        # AVD-* misconfigs and honors our .trivyignore allow-list, and tfsec
        # doesn't respect that file. Keep tfsec for the merged report's
        # rule-name diversity (occasionally tfsec catches things Trivy misses).
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | sudo bash
          tfsec infra/aws --format sarif --out tfsec.sarif --soft-fail

      - name: Upload tfsec SARIF
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: sarif-tfsec
          path: tfsec.sarif
          retention-days: 7

  filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy fs — SARIF output for merge job
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"  # don't fail here; the next step enforces.
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          trivyignores: .trivyignore
          scanners: vuln,misconfig,secret

      - name: Trivy fs — fail the build on findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore
          scanners: vuln,misconfig,secret

      - name: Upload trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: sarif-trivy
          path: trivy.sarif
          retention-days: 7

  merge:
    name: Merge SARIF outputs (sarif-merge)
    needs: [python, secrets, iac, filesystem]
    if: always()  # Run even if scanners failed — we want to show what they found.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Required to post the PR comment.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install sarif-merge
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/AaronGrillot98/sarif-merge.git@main

      - name: Download all SARIF artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: sarif-inputs
          pattern: sarif-*
          merge-multiple: true

      - name: List SARIF inputs
        run: |
          ls -la sarif-inputs/ || echo "(no SARIF artifacts produced)"

      - name: Run sarif-merge
        id: merge
        run: |
          shopt -s nullglob
          inputs=(sarif-inputs/*.sarif)
          if [ ${#inputs[@]} -eq 0 ]; then
            echo "No SARIF artifacts to merge — every scanner job either skipped its emit step or produced no SARIF."
            echo "summary_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p out
          sarif-merge "${inputs[@]}" \
            --output out/merged.sarif \
            --markdown out/summary.md \
            --top 15
          echo "summary_path=out/summary.md" >> "$GITHUB_OUTPUT"
          # Also surface the summary on the run page.
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged SARIF
        if: steps.merge.outputs.summary_path != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: sarif-merged
          path: out/merged.sarif
          retention-days: 14

      - name: Post merged summary to PR
        if: github.event_name == 'pull_request' && steps.merge.outputs.summary_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use a stable header so subsequent runs update the same comment
          # instead of stacking N comments per PR.
          marker="<!-- sarif-merge-summary -->"
          # Prepend marker so we can find/replace on subsequent runs.
          { echo "$marker"; cat out/summary.md; } > out/comment.md

          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -f body="$(cat out/comment.md)" >/dev/null
            echo "Updated existing PR comment $existing"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file out/comment.md
            echo "Posted new PR comment"
          fi
